<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#240711" />
    <title>Offline · Komla's Kitchen</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        color: #fff;
        background:
          radial-gradient(60% 50% at 80% 20%, rgba(155, 31, 69, 0.55), transparent 70%),
          linear-gradient(160deg, #240711, #16040a 70%);
      }
      .card {
        max-width: 420px;
        width: 100%;
        text-align: center;
        padding: 40px 28px;
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.07);
        border: 1px solid rgba(255, 255, 255, 0.14);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
      }
      img { width: 84px; height: 84px; }
      h1 { margin: 18px 0 8px; font-size: 1.6rem; }
      p { margin: 0 0 24px; color: rgba(255, 255, 255, 0.72); line-height: 1.6; }
      a, button {
        display: inline-block;
        margin: 4px;
        padding: 13px 22px;
        border-radius: 12px;
        font: 600 0.95rem system-ui, sans-serif;
        text-decoration: none;
        cursor: pointer;
      }
      a { color: #16040a; background: linear-gradient(135deg, #f2dca2, #e0bb5e 45%, #c99a3c); border: 0; }
      button { color: #fff; background: transparent; border: 1px solid rgba(224, 187, 94, 0.55); }
    </style>
  </head>
  <body>
    <main class="card">
      <img src="/icons/icon-192.png" alt="Komla's Kitchen" />
      <h1>You're offline</h1>
      <p>We can't reach the menu right now. Check your connection, or call us to place your order.</p>
      <a href="tel:3122878155">Call 312-287-8155</a>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
